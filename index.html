<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>MarkTasks</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;padding-bottom:95px;background:#fff}.logo{font-weight:900;font-size:22px}.logo span{color:#fbbf24}.btn-dark{width:100%;background:#0f172a;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:bold;margin-top:8px}.balance-card{background:#fffbeb;border-radius:18px;margin:12px 16px;padding:20px;border:1px solid #fde68a}.task-card{border:1px solid #eee;border-radius:14px;margin:8px 16px;padding:14px;display:flex;gap:12px;align-items:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:12px 0 16px;z-index:99}.nav button{border:0;background:0;font-size:13px;font-weight:bold;color:#6b7280;padding:8px 16px;border-radius:12px}.nav button.active{background:#0f172a;color:#fff;transform:scale(1.1)}.auth{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.auth-box{width:100%;max-width:360px;padding:22px;border-radius:18px;border:1px solid #eee}.popup{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:10000;padding:16px}.popup-box{background:#fff;padding:26px;border-radius:18px;width:100%;max-width:360px;text-align:center}input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px}.task-type-card{border:2px solid #eee;border-radius:12px;padding:10px;margin:5px 0;display:flex;gap:10px;align-items:center;cursor:pointer}.task-type-card.selected{border-color:#0f172a;background:#f0f9ff}.logo-box{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff}.otp-input{letter-spacing:6px;font-size:22px;text-align:center;font-weight:900}.acct-box{background:#f0fdf4;border:2px dashed #10b981;border-radius:12px;padding:16px;margin:12px 0;text-align:center}.task-pop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10001;padding:16px}.task-pop-box{background:#fff;padding:20px;border-radius:16px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}</style></head><body><div id=app></div>

<div id=taskPop class=task-pop onclick=closeTaskPop()><div class=task-pop-box onclick=event.stopPropagation()><h3 id=tpTitle style=margin:0 0 6px></h3><div id=tpType style=font-size:12px;color:#6366f1;font-weight:bold;margin-bottom:8px></div><div id=tpInstr style=font-size:12px;color:#ef4444;font-weight:bold;margin-bottom:8px;display:none></div><div id=tpCustomBox style=display:none;background:#fffbeb;border:1px dashed #f59e0b;border-radius:10px;padding:10px;margin-bottom:10px><div style=font-size:11px;font-weight:bold>Comment to copy:</div><div id=tpCustomText style=font-size:13px;margin:6px 0;word-break:break-word></div><button style=padding:6px 12px;background:#0f172a;color:#fff;border:0;border-radius:6px;font-size:12px onclick=copyCustom()>📋 Copy</button></div><a id=tpLink target=_blank style=display:block;background:#eef2ff;padding:12px;border-radius:10px;text-align:center;font-weight:bold;color:#0f172a;text-decoration:none;margin-bottom:12px>🔗 View Task Link</a><label style=font-weight:bold;font-size:13px>Username used</label><input id=tpUser placeholder="@username"><label style=font-weight:bold;font-size:13px;margin-top:10px;display:block>Submit Proof</label><div id=proofBox onclick=tpFile.click() style=border:2px dashed #0f172a;border-radius:10px;padding:20px;text-align:center;margin-top:6px;cursor:pointer;background:#f9fafb><div style=font-size:30px>📸</div><div id=proofText style=font-size:12px;color:#666;margin-top:4px>Tap to open Gallery</div></div><input id=tpFile type=file accept=image/* style=display:none onchange=showProofName()><button class=btn-dark onclick=submitTask()>Submit Proof</button><button style=width:100%;margin-top:8px;padding:12px;border:1px solid #ddd;background:#fff;border-radius:9px onclick=closeTaskPop()>Cancel</button></div></div>
<script>
const S="service_147bn6m",T="template_kndbrqg",P="eOnK3qvUFiw89dhdV";emailjs.init(P);const AD="markobinna120@gmail.com",DB="marktasks_FINAL_v100";
let db=JSON.parse(localStorage.getItem(DB)||"null");if(!db)db={u:[],t:[],w:[],d:[],ts:[],cu:null};if(!db.w)db.w=[];if(!db.d)db.d=[];if(!db.ts)db.ts=[];
let cur=db.cu?db.u.find(x=>x.id===db.cu):null;let selP=null,selA=null,adm="users",pend=null,otp=null,tmp=0,curT=null;
const PL=[{id:"whatsapp",n:"WhatsApp",i:"WA",c:"#25D366"},{id:"instagram",n:"Instagram",i:"IG",c:"#E1306C"},{id:"tiktok",n:"TikTok",i:"TT",c:"#000"},{id:"facebook",n:"Facebook",i:"FB",c:"#1877F2"},{id:"youtube",n:"YouTube",i:"YT",c:"#FF0000"},{id:"telegram",n:"Telegram",i:"TG",c:"#0088cc"},{id:"website",n:"Website",i:"WS",c:"#f59e0b"}];
const AC={like:{n:"Like",p:11,e:4},follow:{n:"Follow",p:11,e:5},comment:{n:"Comment",p:11,e:5},custom:{n:"Custom Comment",p:50,e:10},share:{n:"Share",p:11,e:4},join:{n:"Join Group/Channel",p:17,e:7},bot:{n:"Start Bot",p:20,e:10},view:{n:"Video View",p:12,e:3},signup:{n:"Website Sign Up",p:30,e:10},vote:{n:"Website Vote",p:30,e:7},visit:{n:"Website Visit",p:30,e:7}};
function gA(p){if(p=="whatsapp")return["join"];if(p=="telegram")return["join","bot"];if(p=="website")return["signup","vote","visit"];return["like","follow","comment","custom","share","view","join"]}
function sv(){localStorage.setItem(DB,JSON.stringify(db))}function isA(u){return u&&u.email.toLowerCase()==AD.toLowerCase()}function pop(m){popMsg.innerText=m;popup.style.display="flex"}function closePop(){popup.style.display="none"}function closeTaskPop(){taskPop.style.display="none"}
function showProofName(){let f=tpFile.files[0];if(f){proofText.innerHTML="✅ "+f.name;proofBox.style.borderColor="#10b981";proofBox.style.background="#f0fdf4"}}function copyCustom(){navigator.clipboard.writeText(tpCustomText.innerText);pop("✅ Copied!")}
function R(){if(!cur){signup();return}main()}function signup(){app.innerHTML=`<div class=auth><div class=auth-box><h2 style=text-align:center>Mark<span style=color:#fbbf24>Tasks</span></h2><input id=sn placeholder="Full Name"><input id=se placeholder=Email><input id=sp type=password placeholder=Password><button class=btn-dark id=sb onclick=sOTP()>Sign Up</button><div id=st style=text-align:center;margin-top:8px;font-size:12px;color:#6366f1></div><br><center><small onclick=loginP()>Have account? <b>Login</b></small></center></div></div>`}
function loginP(){app.innerHTML=`<div class=auth><div class=auth-box><h2 style=text-align:center>Mark<span style=color:#fbbf24>Tasks</span></h2><input id=le placeholder=Email><input id=lp type=password placeholder=Password><button class=btn-dark onclick=log()>Login</button><br><br><center><small onclick=signup()>No account? <b>Sign Up</b></small></center></div></div>`}
async function sOTP(r){let n=r?pend.name:sn.value,e=r?pend.email:se.value.toLowerCase().trim(),p=r?pend.password:sp.value,s=st;if(!n||!e||!p){alert("Fill all");return}if(!e.includes("@")){alert("Real email");return}if(!r&&db.u.find(x=>x.email==e)){alert("Exists");return}otp=Math.floor(100000+Math.random()*900000).toString();pend={id:Date.now(),name:n,email:e,password:p,bal:0,dep:0,banned:false};if(s)s.innerHTML="⏳ Sending to "+e+"...";let b=sb;if(b)b.disabled=true;try{await emailjs.send(S,T,{to_name:n,to_email:e,otp_code:otp});pop("✅ Code sent to "+e);app.innerHTML=`<div class=auth><div class=auth-box><h2 style=text-align:center>Enter Code</h2><p style=text-align:center;font-size:13px>Code to<br><b>${pend.email}</b></p><input id=oi class=otp-input maxlength=6 placeholder=000000><button class=btn-dark onclick=vOTP()>Verify</button><br><center><br><small onclick="pend=null;signup()">Back</small><br><br><small onclick="sOTP(1)" style=color:#6366f1>Resend</small></center><div id=st style=text-align:center;margin-top:8px;font-size:12px;color:#ef4444></div></div></div>`}catch(err){alert("Failed: "+(err.text||err));if(s)s.innerHTML="❌ Failed";if(b)b.disabled=false}}
function vOTP(){let c=oi.value.trim();if(c!==otp){st.innerText="❌ Wrong";return}db.u.push(pend);db.cu=pend.id;cur=pend;sv();pend=null;otp=null;pop("✅ Verified!");main()}
function log(){let e=le.value.toLowerCase().trim(),p=lp.value,u=db.u.find(x=>x.email==e&&x.password==p);if(!u){alert("Wrong");return}if(u.banned){alert("Suspended");return}db.cu=u.id;cur=u;sv();main()}function logout(){db.cu=null;cur=null;sv();R()}
function main(){app.innerHTML=`<div style=padding:12px 16px;display:flex;justify-content:space-between><div class=logo>Mark<span>Tasks</span></div><div style=font-size:11px;text-align:right>${cur.name} ${isA(cur)?"👑":""}<br><b onclick=logout()>Logout</b></div></div><div class=balance-card><div style=font-size:10px>AVAILABLE BALANCE</div><div style=font-size:34px;font-weight:900>₦${cur.bal}</div><button class=btn-dark onclick=shW()>Withdraw</button></div><div id=ct></div><div class=nav><button id=n_home onclick=shH()>🏠<br>Home</button><button id=n_post onclick=shP()>📋<br>Post</button><button id=n_tasks onclick=shT()>✅<br>Tasks</button>${isA(cur)?"<button id=n_admin onclick=shA()>👑<br>Admin</button>":""}</div>`;shH()}
function act(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));let e=document.getElementById("n_"+n);if(e)e.classList.add("active")}function shH(){act("home");ct.innerHTML=`<div style=text-align:center;padding:60px 20px><div style=font-size:40px>👋</div><div style=font-size:18px;font-weight:900;margin-top:10px>Hello ${cur.name}</div><div style=color:#6b7280;margin-top:6px>Welcome</div><button onclick=shT() style=margin-top:20px;background:#0f172a;color:#fff;border:0;padding:12px 24px;border-radius:20px;font-weight:bold>View Tasks →</button></div>`}
function shW(){act("home");ct.innerHTML=`<div style=padding:0 16px><h3>Withdraw</h3><input id=wa type=number placeholder="Min 500"><input id=wb placeholder="Bank - Account - Name"><button class=btn-dark onclick=dW()>Request</button></div>`}function dW(){let a=parseInt(wa.value),b=wb.value;if(!a||a<500||a>cur.bal){alert("Invalid");return}if(!b){alert("Enter account");return}cur.bal-=a;db.u=db.u.map(x=>x.id==cur.id?cur:x);db.w.push({user:cur.name,email:cur.email,amount:a,bank:b,date:new Date().toLocaleString()});sv();pop("Withdrawal placed - 24hrs")}
function shT(){act("tasks");let h=`<div style=padding:0 16px><h3>Tasks • ${db.t.length}</h3>`;if(!db.t.length)h+=`<div style=text-align:center;padding:40px;color:#999">📭 No tasks</div>`;else db.t.forEach(t=>{let p=PL.find(x=>x.id==t.plat)||{i:"?",c:"#999",n:t.plat};let ac=AC[t.action]||{n:t.action,e:t.earn};h+=`<div class=task-card><div class=logo-box style=background:${p.c}>${p.i}</div><div style=flex:1><small style=color:#6366f1;font-weight:bold>${p.n} - ${ac.n}</small><b style=display:block;font-size:13px>${t.ti}</b><small style=color:#10b981;font-weight:bold>Earn ₦${t.earn}</small></div><button style=padding:8px 12px;background:#0f172a;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:12px onclick=openTask(${t.id})>Start</button></div>`});h+=`</div>`;ct.innerHTML=h}
function openTask(id){let t=db.t.find(x=>x.id==id);if(!t)return;curT=t;let p=PL.find(x=>x.id==t.plat);let ac=AC[t.action];tpTitle.innerText=t.ti;tpType.innerText=(p?p.n:t.plat)+" - "+(ac?ac.n:t.action);tpLink.href=t.link;if(t.action=="view"){tpInstr.style.display="block";tpInstr.innerText="⚠️ You must watch at least 30 seconds"}else{tpInstr.style.display="none"}if(t.action=="custom"&&t.customComment){tpCustomBox.style.display="block";tpCustomText.innerText=t.customComment}else{tpCustomBox.style.display="none"}tpUser.value="";tpFile.value="";proofText.innerHTML="Tap to open Gallery";proofBox.style.borderColor="#0f172a";proofBox.style.background="#f9fafb";taskPop.style.display="flex"}
function submitTask(){let u=tpUser.value,f=tpFile.files[0];if(!u){alert("Username");return}if(!f){alert("Upload proof");return}db.ts.push({taskId:curT.id,taskTitle:curT.ti,user:cur.name,email:cur.email,username:u,proof:f.name,earn:curT.earn,date:new Date().toLocaleString()});sv();closeTaskPop();pop("Submitted! Review 24-48hrs - ₦"+curT.earn)}
  function shP(){act("post");let plats=PL.map(p=>`<div class=task-type-card id=plat_${p.id} onclick=selPFunc('${p.id}')><div class=logo-box style=background:${p.c}>${p.i}</div><div style=flex:1><b style=font-size:13px>${p.n}</b></div><div id=check_plat_${p.id} style=width:22px;height:22px;border:2px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center></div></div>`).join("");ct.innerHTML=`<div style=padding:0 16px><h3>Post Task</h3><div style=background:#eef2ff;padding:12px;border-radius:10px;margin-bottom:12px><div style=font-size:10px>DEPOSIT BALANCE</div><div style=font-size:22px;font-weight:900>₦${cur.dep}</div><button class=btn-dark style=padding:8px onclick=shD()>+ Deposit</button></div><label style=font-weight:bold;font-size:13px>1. Task Name (Platform)</label>${plats}<div id=actionSection style=display:none><label style=font-weight:bold;font-size:13px;margin-top:12px;display:block>2. Task Type</label><div id=actionList></div><div id=customCommentSection style=display:none><label style=font-weight:bold;font-size:13px;margin-top:8px;display:block>Type custom comment</label><textarea id=customCommentInput placeholder="e.g Nice video!"></textarea></div></div><div id=postForm style=display:none><label style=font-weight:bold;font-size:13px;margin-top:12px;display:block>3. Title</label><input id=pti placeholder="e.g Follow my IG"><label style=font-weight:bold;display:block>4. Link</label><input id=tlink placeholder=https://...><label style=font-weight:bold;display:block>5. Workers</label><input id=psl type=number placeholder=100 oninput=calc()><div id=ca style=padding:12px;background:#f0fdf4;border-radius:8px;margin:8px 0;font-weight:bold>Select type</div><button class=btn-dark onclick=dP()>Post Task</button></div></div>`}
function selPFunc(pid){selP=PL.find(x=>x.id==pid);selA=null;document.querySelectorAll("[id^=plat_]").forEach(c=>c.classList.remove("selected"));document.getElementById("plat_"+pid).classList.add("selected");PL.forEach(p=>{let e=document.getElementById("check_plat_"+p.id);if(e){e.innerHTML="";e.style.background="#fff"}});let ch=document.getElementById("check_plat_"+pid);ch.innerHTML="✓";ch.style.background="#0f172a";ch.style.color="#fff";let acts=gA(pid);let html=acts.map(aid=>{let a=AC[aid];return `<div class=task-type-card id=act_${aid} onclick=selAFunc('${aid}')><div style=flex:1><b style=font-size:13px>${a.n}</b><br><small>Price: ₦${a.p}</small></div><div id=check_act_${aid} style=width:22px;height:22px;border:2px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center></div></div>`}).join("");actionList.innerHTML=html;actionSection.style.display="block";postForm.style.display="none"}
function selAFunc(aid){selA=aid;let acts=gA(selP.id);document.querySelectorAll("[id^=act_]").forEach(c=>c.classList.remove("selected"));document.getElementById("act_"+aid).classList.add("selected");acts.forEach(id=>{let e=document.getElementById("check_act_"+id);if(e){e.innerHTML="";e.style.background="#fff"}});let ch=document.getElementById("check_act_"+aid);ch.innerHTML="✓";ch.style.background="#0f172a";ch.style.color="#fff";if(aid=="custom"){customCommentSection.style.display="block"}else{customCommentSection.style.display="none"}postForm.style.display="block";calc()}
function shD(){ct.innerHTML=`<div style=padding:0 16px><h3>Deposit</h3><input id=depAmt type=number placeholder="Amount"><button class=btn-dark onclick=goAc()>Continue</button></div>`}function goAc(){let a=parseInt(depAmt.value);if(!a||a<100){alert("Min 100");return}tmp=a;ct.innerHTML=`<div style=padding:0 16px><h3>Pay ₦${a}</h3><div class=acct-box><div style=font-size:12px>TRANSFER TO:</div><div style=font-size:20px;font-weight:900;margin:8px 0>5895097608</div><div style=font-weight:bold>Moniepoint</div><div style=font-weight:bold;color:#0f172a>Ugochi Patricia Etumugo</div><div style=margin-top:10px;background:#fff;padding:8px;border-radius:8px>Amount: <b>₦${a}</b></div></div><label style=font-weight:bold;font-size:13px>Your Account Name</label><input id=sName placeholder="Name that sent money"><button class=btn-dark onclick=cD()>I Have Sent</button><button style=width:100%;margin-top:8px;padding:12px;border:1px solid #ddd;background:#fff;border-radius:9px onclick=shD()>Back</button></div>`}
function cD(){let s=sName.value;if(!s){alert("Enter name");return}db.d.push({user:cur.name,email:cur.email,amount:tmp,sender:s,date:new Date().toLocaleString()});sv();pop("Deposit will be reviewed within 24 hours");shP()}
function calc(){if(!selP||!selA){ca.innerHTML="Select platform & type";return}let a=AC[selA];let w=parseInt(psl.value)||0;ca.innerHTML=`${selP.n} - ${a.n}<br>Price: ₦${a.p} x ${w} = <b>₦${a.p*w}</b><br>You have ₦${cur.dep}`}function dP(){if(!selP||!selA){alert("Select platform & type");return}let ti=pti.value,lk=tlink.value,w=parseInt(psl.value)||0,cc=customCommentInput?customCommentInput.value:"";if(!ti||!lk||!w){alert("Fill all");return}if(selA=="custom"&&!cc){alert("Type comment");return}let a=AC[selA];let tot=a.p*w;if(tot>cur.dep){alert("Low deposit Need ₦"+tot);return}cur.dep-=tot;db.u=db.u.map(x=>x.id==cur.id?cur:x);db.t.unshift({id:Date.now(),plat:selP.id,action:selA,ti:ti,link:lk,pay:a.p,earn:a.e,customComment:cc});sv();pop("Task posted!");setTimeout(()=>shT(),1000)}
function shA(){if(!isA(cur))return;act("admin");ct.innerHTML=`<div style=padding:0 16px><h3>👑 Admin</h3><div style=display:flex;gap:6px;flex-wrap:wrap;margin:10px 0><button style=padding:10px 16px;border-radius:20px;border:1.5px solid #0f172a;background:${adm=="users"?"#0f172a":"#fff"};color:${adm=="users"?"#fff":"#000"};font-weight:bold onclick="adm='users';shA()">Users (${db.u.length})</button><button style=padding:10px 16px;border-radius:20px;border:1.5px solid #0f172a;background:${adm=="tasks"?"#0f172a":"#fff"};color:${adm=="tasks"?"#fff":"#000"};font-weight:bold onclick="adm='tasks';shA()">Tasks (${db.t.length})</button><button style=padding:10px 16px;border-radius:20px;border:1.5px solid #0f172a;background:${adm=="subs"?"#0f172a":"#fff"};color:${adm=="subs"?"#fff":"#000"};font-weight:bold onclick="adm='subs';shA()">Proofs (${db.ts.length})</button></div><div id=adm></div></div>`;let el=adm;if(adm=="users"){el.innerHTML=db.u.map(u=>`<div class=task-card style=flex-direction:column;align-items:stretch;${u.banned?"background:#fee2e2":""}><b>${u.name} ${u.email==AD?"👑":""} ${u.banned?"(BLOCKED)":""}</b><small>${u.email} | Bal ₦${u.bal} Dep ₦${u.dep}</small>${u.email!=AD?`<div style=display:flex;gap:6px;margin-top:8px><button style=flex:1;padding:10px;background:${u.banned?"#10b981":"#f59e0b"};color:#fff;border:0;border-radius:6px onclick=blk(${u.id})>${u.banned?"Restore":"Block"}</button><button style=flex:1;padding:10px;background:#ef4444;color:#fff;border:0;border-radius:6px onclick=delU(${u.id})>Delete</button></div>`:""}</div>`).join("")}else if(adm=="tasks"){el.innerHTML=db.t.map(t=>`<div class=task-card style=justify-content:space-between><div><b>${t.ti}</b><br><small>${t.plat} - ${t.action} ₦${t.pay}</small></div><button style=background:#ef4444;color:#fff;border:0;padding:8px 14px;border-radius:6px onclick=delT(${t.id})>Del</button></div>`).join("")||"No tasks"}else{el.innerHTML=db.ts.map((s,i)=>`<div class=task-card style=flex-direction:column;align-items:stretch><b>${s.taskTitle} - ₦${s.earn}</b><small>${s.user} (${s.email})</small><small>Username: ${s.username}</small><small>Proof: ${s.proof}</small><div style=display:flex;gap:6px;margin-top:6px><button style=flex:1;padding:8px;background:#10b981;color:#fff;border:0;border-radius:6px onclick=apT(${i})>Approve</button><button style=flex:1;padding:8px;background:#ef4444;color:#fff;border:0;border-radius:6px onclick="db.ts.splice(${i},1);sv();shA()">Reject</button></div></div>`).join("")||"No proofs"}}
function delT(id){if(!confirm("Delete?"))return;db.t=db.t.filter(x=>x.id!=id);sv();shA();pop("Deleted")}function apT(i){let s=db.ts[i],u=db.u.find(x=>x.email==s.email);if(u){u.bal+=s.earn;db.u=db.u.map(x=>x.email==s.email?u:x)}db.ts.splice(i,1);sv();shA();pop("Approved ₦"+s.earn)}
function blk(id){let u=db.u.find(x=>x.id==id);u.banned=!u.banned;sv();shA();pop(u.banned?"Blocked":"Restored")}function delU(id){if(!confirm("Perm delete?"))return;if(!confirm("Sure?"))return;db.u=db.u.filter(x=>x.id!=id);if(db.cu==id){db.cu=null;cur=null}sv();pop("Deleted");if(!cur)R();else shA()}R();</script></body></html>
